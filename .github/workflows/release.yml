name: Release

# Tag-driven releases: `git tag v0.1.0 && git push --tags` produces a signed
# APK attached to a GitHub Release. Nothing is published from branch pushes.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version name, e.g. 0.1.0"
        required: true

permissions:
  contents: write
  packages: write

jobs:
  android:
    name: Signed APK
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.value }}
    steps:
      - uses: actions/checkout@v4

      - id: version
        name: Resolve version
        run: |
          if [ -n "${{ inputs.version }}" ]; then
            echo "value=${{ inputs.version }}" >> "$GITHUB_OUTPUT"
          else
            echo "value=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: Restore signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "KEYSTORE_BASE64 is not set. Add it before tagging a release." >&2
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/kiku-release.jks"

      - name: Write google-services.json
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: echo "$GOOGLE_SERVICES_JSON" > android/app/google-services.json

      - name: Build release APK and bundle
        working-directory: android
        env:
          KEYSTORE_PATH: ${{ runner.temp }}/kiku-release.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          VERSION_NAME: ${{ steps.version.outputs.value }}
          API_BASE_URL: ${{ secrets.API_BASE_URL }}
        run: ./gradlew assembleRelease bundleRelease --stacktrace

      - name: Rename artifacts
        run: |
          mkdir -p dist
          V="${{ steps.version.outputs.value }}"
          cp android/app/build/outputs/apk/release/*.apk "dist/kiku-$V.apk"
          cp android/app/build/outputs/bundle/release/*.aab "dist/kiku-$V.aab"
          sha256sum dist/* > dist/checksums.txt

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: kiku-release
          path: dist/

  backend:
    name: Backend image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/backend:latest
            ghcr.io/${{ github.repository }}/backend:${{ github.ref_name }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  publish:
    name: GitHub Release
    runs-on: ubuntu-latest
    needs: [android, backend]
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: kiku-release
          path: dist

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          name: Kiku ${{ needs.android.outputs.version }}
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(needs.android.outputs.version, '-') }}
          files: |
            dist/*.apk
            dist/*.aab
            dist/checksums.txt
          body: |
            Install the APK directly, or pull the backend image:

                docker pull ghcr.io/${{ github.repository }}/backend:${{ github.ref_name }}

            Verify your download against `checksums.txt`.
